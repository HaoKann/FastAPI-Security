<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата прошла успешно!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0fdf4; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #16a34a; font-size: 24px; }
        p { color: #4b5563; margin-bottom: 25px; line-height: 1.5; }
        a.button { display: inline-block; background-color: #4f46e5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background-color 0.2s; }
        a.button:hover { background-color: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
        <h1>Оплата прошла успешно!</h1>
        <p>Спасибо за вашу покупку. Ваш платеж успешно обработан.</p>
        <!-- Ссылка ведет на корень сайта, при необходимости измените href -->
        <a href="/" class="button">Вернуться на главную</a>
    </div>
</body>
</html>
