services:
  # 1. Сервис Базы Данных (PostgreSQL)
  db:
    image: postgres:15
    container_name: fastapi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD} #  БЕРЕМ ИЗ ФАЙЛА .env
      POSTGRES_DB: fastapi_auth # <--- Имя должно совпадать с тем, что в твоем конфиге!
    ports:
      - "5433:5432" # Чтобы можно было подключаться к БД через DBeaver с компа
    volumes:
      - postgres_data:/var/lib/postgresql/data # Чтобы данные не исчезали при перезагрузке
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_auth"] 
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Сервис Redis (для Celery и кэша)
  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Celery Воркер
  celery_worker:
    build: . # Собираем из того же образа, что и FastAPI
    container_name: fastapi_celery_worker
    restart: always
    # Запускаем не сервер, а фонового работягу:
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: fastapi_auth
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app # ИСПРАВЛЕНО: Теперь воркер сразу видит изменения в коде
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 4. Приложение FastAPI
  web:
    build: . # Строим образ из Dockerfile в текущей папке
    container_name: fastapi_app
    restart: always
    volumes:
      - .:/app  # Точка (.) это текущая папка Windows, /app это папка контейнера
    # ИСПРАВЛЕНО: Добавлен параметр --reload для горячей перезагрузки при разработке
    command: gunicorn main:app --reload --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm    
    ports:
      - "8001:8000"
    env_file:
      - .env
    # САМОЕ ВАЖНОЕ: Передаем переменные внутрь контейнера
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST: db  # Имя контейнера базы
      DB_PORT: 5432 # Порт ВНУТРИ сети Docker (стандартный)
      DB_USER: postgres
      DB_NAME: fastapi_auth
      REDIS_URL: redis://redis:6379/0 # Вместо localhost пишем "redis"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

# MinIO S3 Хранилище
  minio:
    image: minio/minio:latest
    container_name: fastapi_minio # API порт (через него код общается с MinIO)
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001" # Console порт (админка в браузере)
    environment:
      MINIO_ROOT_USER: minioadmin # Логин суперюзера
      MINIO_ROOT_PASSWORD: minioadmin # Пароль суперюзера
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data # Чтобы файлы не пропадали при перезапуске
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
